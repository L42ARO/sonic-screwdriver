name: sonic-sd-compute-box
services:
  compute-box:
    image: sonic-sd-compute-box:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SONIC_ADDR: 0.0.0.0:8080
      SONIC_DATA_DIR: /data
      SONIC_SCRIPTS_DIR: /app/scripts
      SONIC_PUBLIC_URL: ${SONIC_PUBLIC_URL:-}
    ports:
      - "${SONIC_PUBLISH_ADDRESS:-0.0.0.0}:${SONIC_PORT:-6080}:8080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data:
