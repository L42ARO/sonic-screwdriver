{{define "head"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}} · sonic-screwdriver</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e2e2e2; --card:#fff;
          --ok:#1f7a3a; --bad:#b3261e; --run:#1d4ed8; --wait:#8a6d00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#e8e8e8; --muted:#9a9a9a; --line:#2b2b2b; --card:#181818;
            --ok:#5bc97a; --bad:#f28b82; --run:#7aa7ff; --wait:#e0c060; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 0; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
  a { color: inherit; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .row:first-of-type { border-top: 0; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background: var(--muted); }
  .dot.on { background: var(--ok); }
  .s-succeeded { color: var(--ok); } .s-failed, .s-cancelled { color: var(--bad); }
  .s-running { color: var(--run); } .s-queued { color: var(--wait); }
  code, pre { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
  .steps img { width: 100%; max-width: 640px; border: 1px solid var(--line); border-radius: 4px; margin-top: 6px; }
  .step { padding: 12px 0; border-top: 1px solid var(--line); }
  nav { padding-bottom:12px; margin-bottom:20px; border-bottom:1px solid var(--line); }
  nav a { text-decoration:none; font-weight:600; }
  h2.section { margin: 8px 0 10px; }
  .title { display:flex; justify-content:space-between; align-items:baseline; gap:8px 12px; flex-wrap:wrap; margin-bottom:8px; }
  .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:24px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; display:flex; flex-direction:column; }
  .stat .label { font-size:12px; color:var(--muted); }
  .stat .value { font-size:22px; font-weight:600; font-variant-numeric: tabular-nums; }
  .cols { display:grid; grid-template-columns: 1fr; gap:0 24px; margin-bottom:8px; }
  @media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); } }
  .filters { display:flex; gap:8px; }
  select { font: inherit; font-size:12px; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:3px 6px; max-width: 150px; }
  .grid { display:grid; grid-template-columns: minmax(90px, max-content) 1fr; gap:4px 16px; margin-top:6px; }
  .grid > :nth-child(odd) { color: var(--muted); }
  .grid > * { min-width: 0; overflow-wrap: anywhere; }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); }
  details details { margin-top: 6px; }
  .op { padding: 12px 0; border-top: 1px solid var(--line); } .op:first-of-type { border-top: 0; }
  .text { white-space: pre-wrap; margin: 6px 0 0; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  [hidden] { display: none !important; }
  nav { display:flex; justify-content:space-between; align-items:center; }
  form.inline { display:inline-flex; gap:6px; margin:0; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; } .actions form { margin:0; }
  input { font: inherit; font-size:13px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; min-width:0; }
  button { font: inherit; font-size:13px; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); padding:8px 16px; }
  button.danger { color: var(--bad); }
  button.link { border:0; background:none; color:var(--muted); padding:0; } button.link:hover { color:var(--fg); }
  .narrow { max-width: 560px; margin: 24px auto; }
  .secret { display:flex; gap:8px; align-items:center; margin:16px 0; padding:12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); }
  form.stack { display:flex; flex-direction:column; gap:10px; margin:12px 0 0; }
  form.stack label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  form.stack input { font-size:14px; padding:8px 10px; }
  form.stack button { align-self:flex-start; }
  .secret code { flex:1; font-size:13px; overflow-wrap:anywhere; user-select:all; }
</style>
</head>
<body><main>
<nav><a href="/">sonic-screwdriver</a>{{if ne . "Sign in"}}<form class="inline" method="post" action="/logout"><button type="submit" class="link">Sign out</button></form>{{end}}</nav>
{{end}}

{{define "foot"}}
</main></body></html>
{{end}}
