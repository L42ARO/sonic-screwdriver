[package]
name = "local-agent"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# The package (and the folder, settings and other internal names) is "local-agent"; the
# program people download and run is SonicScrew-Local-Agent.exe.
[[bin]]
name = "SonicScrew-Local-Agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
enigo = "0.6.1"
futures-util = "0.3.34"
image = "0.25.10"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_HiDpi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Console", "Win32_Storage_FileSystem"] }
xcap = "0.9.10"

# Image work is unusably slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
embed-resource = "3.0.12"
